<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-label="闲存云在 AI 基站（AI-RAN）里的位置图">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif; font-size: 17px; font-weight: 600; fill: #0f172a; }
      .lead  { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif; font-size: 12px; fill: #64748b; }
      .sub   { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif; font-size: 15px; font-weight: 600; fill: #0f172a; }
      .h     { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif; font-size: 13px; font-weight: 600; fill: #1e293b; }
      .t     { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif; font-size: 9.5px; fill: #475569; }
      .tag   { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif; font-size: 11px; fill: #64748b; }
      .lbl   { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif; font-size: 10px; fill: #64748b; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="790" fill="#ffffff"/>

  <text x="40" y="46" class="title">闲存云 × AI 基站（AI-RAN）位置图</text>
  <text x="40" y="72" class="lead">画的是"已实现的能力在 AI 基站侧落位在哪"，不是"已交付 AI-RAN 产品"；底部四条边界必须和这张图一起出现。</text>

  <!-- ===== 左：AI 基站侧 ===== -->
  <rect x="40" y="100" width="270" height="520" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4"/>
  <text x="175" y="130" text-anchor="middle" class="sub">AI 基站 / AI-RAN</text>

  <rect x="58" y="150" width="234" height="54" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.1"/>
  <text x="175" y="172" text-anchor="middle" class="h">RU / AAU 无线侧</text>
  <text x="175" y="192" text-anchor="middle" class="t">射频与天线，产生真正的流量</text>

  <rect x="58" y="214" width="234" height="54" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.1"/>
  <text x="175" y="236" text-anchor="middle" class="h">DU / CU（O-RAN 拆分）</text>
  <text x="175" y="256" text-anchor="middle" class="t">基带与集中单元</text>

  <rect x="58" y="278" width="234" height="78" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.1"/>
  <text x="175" y="300" text-anchor="middle" class="h">① 边缘服务器（MEC）</text>
  <text x="175" y="320" text-anchor="middle" class="t">带 GPU / NPU 的推理机</text>
  <text x="175" y="338" text-anchor="middle" class="t">内存多数时段是闲着的</text>

  <rect x="58" y="352" width="234" height="0" fill="none"/>

  <rect x="58" y="366" width="234" height="54" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.1"/>
  <text x="175" y="388" text-anchor="middle" class="h">前传 / 中传 / 回传</text>
  <text x="175" y="408" text-anchor="middle" class="t">承载网，决定时延上限</text>

  <rect x="58" y="430" width="234" height="78" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.1"/>
  <text x="175" y="452" text-anchor="middle" class="h">本地推理</text>
  <text x="175" y="472" text-anchor="middle" class="t">小模型 · 特征提取 · 会话状态</text>
  <text x="175" y="490" text-anchor="middle" class="t">最吃缓存、最怕回源的一层</text>

  <text x="175" y="536" text-anchor="middle" class="tag">内存常态利用率 40–60%</text>
  <text x="175" y="558" text-anchor="middle" class="tag">剩下的闲置内存才是闲存云吃的</text>
  <text x="175" y="590" text-anchor="middle" class="t">不占业务内存，按压力自动让路</text>

  <!-- ===== 中上：控制面 ===== -->
  <rect x="340" y="100" width="400" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="540" y="130" text-anchor="middle" class="sub">idlemem-server · 调度控制面</text>

  <rect x="358" y="150" width="364" height="56" rx="6" fill="#ecfdf5" stroke="#86efac" stroke-width="1.2"/>
  <text x="540" y="172" text-anchor="middle" class="h">REST 管理 API　:8080</text>
  <text x="540" y="192" text-anchor="middle" class="t">节点 / 租户 / 订单 / 计费 / 备份</text>

  <rect x="358" y="214" width="364" height="56" rx="6" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.2"/>
  <text x="540" y="236" text-anchor="middle" class="h">② Redis 协议网关　:6379</text>
  <text x="540" y="256" text-anchor="middle" class="t">AUTH 租户隔离 · 18 条命令 · 配额限流</text>

  <rect x="358" y="278" width="364" height="56" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="540" y="300" text-anchor="middle" class="h">调度器 Scheduler</text>
  <text x="540" y="320" text-anchor="middle" class="t">分片分配 · 双副本 · 掉线自愈（≈34 s）</text>

  <rect x="358" y="342" width="364" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="540" y="364" text-anchor="middle" class="h">持久化 buntdb（单文件）</text>
  <text x="540" y="383" text-anchor="middle" class="t">节点 / 租户 / 订单 / 分片元数据</text>

  <!-- ===== 中下：节点池 ===== -->
  <rect x="340" y="430" width="400" height="200" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4"/>
  <text x="540" y="460" text-anchor="middle" class="sub">① Agent 节点池（idlemem-core）</text>

  <rect x="358" y="476" width="364" height="44" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.1"/>
  <text x="540" y="502" text-anchor="middle" class="h">agent-1　KV :16380</text>

  <rect x="358" y="528" width="364" height="44" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.1"/>
  <text x="540" y="554" text-anchor="middle" class="h">agent-2　KV :16381</text>

  <rect x="358" y="580" width="364" height="44" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.1"/>
  <text x="540" y="606" text-anchor="middle" class="h">agent-N　KV :1638N</text>

  <!-- ===== 右：应用侧 ===== -->
  <rect x="800" y="100" width="360" height="520" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.4"/>
  <text x="980" y="130" text-anchor="middle" class="sub">② AI 基站侧应用</text>

  <rect x="818" y="150" width="324" height="64" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.1"/>
  <text x="980" y="174" text-anchor="middle" class="h">近实时 RIC / xApp</text>
  <text x="980" y="194" text-anchor="middle" class="t">策略与无线资源调度，读多写少</text>

  <rect x="818" y="222" width="324" height="76" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.1"/>
  <text x="980" y="246" text-anchor="middle" class="h">本地推理服务</text>
  <text x="980" y="266" text-anchor="middle" class="t">模型权重热缓存 · 特征缓存</text>
  <text x="980" y="284" text-anchor="middle" class="t">回源一次几十毫秒，缓存命中就省掉</text>

  <rect x="818" y="306" width="324" height="76" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.1"/>
  <text x="980" y="330" text-anchor="middle" class="h">MEC 业务</text>
  <text x="980" y="350" text-anchor="middle" class="t">会话上下文 · 热点数据 · 去重表</text>
  <text x="980" y="368" text-anchor="middle" class="t">典型 Redis 用法，接上就迁走</text>

  <rect x="818" y="390" width="324" height="76" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.1"/>
  <text x="980" y="414" text-anchor="middle" class="h">运营支撑</text>
  <text x="980" y="434" text-anchor="middle" class="t">按租户计量 · 配额 · 分账</text>
  <text x="980" y="452" text-anchor="middle" class="t">谁贡献了内存，谁就拿到这份收益</text>

  <text x="980" y="502" text-anchor="middle" class="tag">接入方式不变：标准 Redis 客户端 + AUTH token</text>
  <text x="980" y="524" text-anchor="middle" class="tag">业务代码不用改，只把连接串指到网关 :6379</text>
  <text x="980" y="556" text-anchor="middle" class="t">不引入新 SDK、不绑云厂商</text>

  <!-- 右 -> 网关 -->
  <line x1="800" y1="241" x2="742" y2="241" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="770" y="228" text-anchor="middle" class="lbl">Redis 协议</text>

  <!-- 节点池 -> 调度器：心跳 -->
  <line x1="620" y1="428" x2="620" y2="404" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <!-- 调度器 -> 节点池：写转发 -->
  <line x1="470" y1="402" x2="470" y2="426" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="545" y="419" text-anchor="middle" class="lbl">心跳 / 写转发</text>

  <!-- ===== 底部边界 ===== -->
  <rect x="40" y="650" width="1120" height="122" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.2"/>
  <text x="60" y="676" class="h">边界与前提（对外必须和这张图一起说）</text>
  <text x="60" y="700" class="t">① 不持久化：Agent / 托盘重启，节点上的缓存即失效 —— 只做缓存，不做存储。</text>
  <text x="600" y="700" class="t">② 单副本订单掉线即丢；双副本实测 34.3 s 在存活节点重新 active，不搬内存数据。</text>
  <text x="60" y="724" class="t">③ 网关写路径串行：20 线程 26.1k 命令/s，50 线程反降到 1.56k，不宣称线性扩展。</text>
  <text x="600" y="724" class="t">④ 无 TLS、无 AES，现网按内网可信假设部署；不绑定任何 AI-RAN 标准或厂商。</text>
  <text x="60" y="750" class="t">数据口径见 BENCHMARK.md 与 docs/掉线自愈验证.md；这张图只表达"落位"，不表达"已交付 AI-RAN"。</text>
</svg>

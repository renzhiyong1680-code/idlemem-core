name: ci

on:
  push:
    branches: [master, main]
    # 纯库不发二进制，但 tag 也要跑测试：打标签时点的代码必须可验证，
    # 否则 Release 页面上没有任何 CI 记录，外部无法判断 v0.1.1 是否可信。
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1

      # 这个库是要被三个外壳共用的，交叉编译必须全程无 CGO 依赖；
      # 目标平台编不过，说明有代码悄悄带了平台相关的东西。
      - name: cross build agent
        run: |
          set -euo pipefail
          for t in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            echo "building $t"
            GOOS="${t%/*}" GOARCH="${t#*/}" CGO_ENABLED=0 \
              go build -trimpath -o /dev/null ./cmd/xiancun-agent
          done
